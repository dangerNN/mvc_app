<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .reg-container {
            max-width: 400px;
            margin-top: 8%;
        }
    </style>
</head>
<body>

    <div class="container reg-container">
        <div class="card shadow p-4 bg-dark text-white rounded-3">
            <h3 class="text-center mb-4 text-success fw-bold">Регистрация</h3>

            <form id="registerForm" onsubmit="submitRegister(event)">
                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" id="regName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="regEmail" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" id="regPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mb-3">Зарегистрироваться</button>
            </form>

            <div class="text-center">
                <small class="text-muted">Уже зарегистрированы? <a href="/login.html" class="text-success">Войти</a></small>
            </div>
        </div>
    </div>

    <script>
        async function submitRegister(event) {
            event.preventDefault();

            let studentData = {
                name: document.getElementById("regName").value,
                email: document.getElementById("regEmail").value,
                password: document.getElementById("regPassword").value
            };

            try {
                let response = await fetch('/api/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(studentData)
                });

                if (response.ok) {
                    alert("Регистрация успешна! Теперь вы можете войти.");
                    window.location.href = "/login.html";
                } else {
                    alert("Ошибка при регистрации. Возможно, некорректный email.");
                }
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
