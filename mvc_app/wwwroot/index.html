<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление студентами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-sm navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-info" href="#">Student API Manager</a>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Выйти</button>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Список студентов (Чистый JS + AJAX)</h2>
            <button class="btn btn-primary fw-bold" onclick="openModal('createModal')">Добавить студента</button>
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover shadow rounded overflow-hidden">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Имя</th>
                        <th>E-mail</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="createModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Новый студент</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="closeModal('createModal')"></button>
                </div>
                <div class="modal-body">
                    <form id="createForm" onsubmit="saveNewStudent(event)">
                        <div class="mb-3">
                            <label class="form-label">Имя студента</label>
                            <input type="text" id="createName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" id="createEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" id="createPassword" class="form-control" required>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('createModal')">Отмена</button>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Редактировать студента</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="closeModal('editModal')"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm" onsubmit="saveStudentUpdate(event)">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Имя студента</label>
                            <input type="text" id="editName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail</label>
                            <input type="email" id="editEmail" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль (оставьте старый или введите новый)</label>
                            <input type="password" id="editPassword" class="form-control" required>
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" onclick="closeModal('editModal')">Отмена</button>
                            <button type="submit" class="btn btn-success">Обновить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
